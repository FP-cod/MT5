<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comptes MT5</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
  </head>
  <body>
    <nav class="sidebar">
      <div class="brand">MT5 Accounts</div>
      <a href="/">Accueil</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/admin">Admin</a>
      <a href="/accounting">Comptabilité</a>
      <a href="/logout">Déconnexion</a>
    </nav>

    <main class="content">
      <div class="container py-4">
        <h1>Gestion des comptes</h1>

        <div class="row g-4">
          <div class="col-md-4">
            <div class="card p-4">
              <h3>Compte demo</h3>
              <ul class="key-value-list">
                <li><span>Balance</span><strong>€ 100,000</strong></li>
                <li><span>Leverage</span><strong>1:30</strong></li>
                <li><span>Mode</span><strong>Dry run</strong></li>
              </ul>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-4">
              <h3>Compte live</h3>
              <ul class="key-value-list">
                <li><span>Balance</span><strong>--</strong></li>
                <li><span>Leverage</span><strong>--</strong></li>
                <li><span>Mode</span><strong>Offline</strong></li>
              </ul>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-4">
              <h3>Actions</h3>
              <button class="btn btn-primary w-100 mb-2">Ajouter un compte</button>
              <button class="btn btn-outline-secondary w-100">Importer config</button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
