<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <title>Accounting - MT5 Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/styles.css" rel="stylesheet">
  </head>
  <body class="p-4">
    <div class="container">
      <h1>Comptabilité</h1>
      <div class="mb-3">
        <button id="exportBtn" class="btn btn-secondary">Exporter CSV</button>
        <a class="btn btn-link" href="/">Retour</a>
      </div>

      <div class="mb-4">
        <label>Mode:</label>
        <select id="modeSelect" class="form-select" style="width:200px;display:inline-block"></select>
        <button id="switchMode" class="btn btn-sm btn-primary">Basculer</button>
      </div>

      <h3>Nouvelle écriture</h3>
      <form id="entryForm">
        <div class="row">
          <div class="col-md-3 mb-2"><input class="form-control" name="date" placeholder="YYYY-MM-DD" /></div>
          <div class="col-md-2 mb-2"><input class="form-control" name="category" placeholder="category" /></div>
          <div class="col-md-2 mb-2"><input class="form-control" name="subcategory" placeholder="subcategory" /></div>
          <div class="col-md-1 mb-2"><select class="form-control" name="type"><option value="credit">credit</option><option value="debit">debit</option></select></div>
          <div class="col-md-2 mb-2"><input class="form-control" name="amount" placeholder="amount" /></div>
          <div class="col-md-2 mb-2"><input class="form-control" name="description" placeholder="description" /></div>
        </div>
        <button class="btn btn-success mt-2">Ajouter</button>
      </form>

      <h3 class="mt-4">Écritures récentes</h3>
      <table class="table table-sm" id="entriesTable">
        <thead><tr><th>date</th><th>category</th><th>type</th><th>amount</th><th>currency</th><th>description</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>

    <script src="/static/js/dashboard.js"></script>
  </body>
</html>
